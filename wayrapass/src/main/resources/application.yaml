spring:
  application:
    name: wayrapass
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wayrapass_db}
    username: ${DB_USERNAME:wayrapass_user}
    password: ${DB_PASSWORD:WayraPass123!}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:V2F5cmFQYXNzLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi0yMDI2}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  password-reset:
    expose-development-token: ${EXPOSE_PASSWORD_RESET_TOKEN:true}
